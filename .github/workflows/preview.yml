name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'feat/**'
  workflow_dispatch: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Prepare gh-pages branch
        env:
          REPO: ${{ github.repository }}
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          PR_NUM: ${{ github.event.pull_request.number || '' }}
          BRANCH_NAME: ${{ github.ref_name }}
          PREVIEW_PATH: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
        run: |
          set -euo pipefail
          TMP=gh-pages-tmp
          rm -rf $TMP
          mkdir -p $TMP
          cd $TMP

          # Try to fetch gh-pages branch; create it if missing
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" .
          else
            git init .
            git remote add origin "$REPO_URL"
            git checkout --orphan gh-pages
            git commit --allow-empty -m "chore: initialize gh-pages branch"
            git push origin gh-pages
          fi

          # Clean target preview folder and copy build
          TARGET_DIR="previews/${PREVIEW_PATH}"
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          cp -r ../dist/* "$TARGET_DIR/"

          git add --all
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "chore(preview): update preview for ${PREVIEW_PATH}" || echo "No changes to commit"
          git push origin gh-pages

      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PREVIEW_URL: https://
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          PREVIEW_PATH="previews/pr-${PR_NUM}"
          PREVIEW_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${PREVIEW_PATH}/"
          echo "Posting preview URL: $PREVIEW_URL"
          gh auth status || true
          gh pr comment $PR_NUM --repo ${{ github.repository }} --body "Preview available: $PREVIEW_URL"
